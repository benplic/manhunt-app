services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: manhunt
      POSTGRES_PASSWORD: manhunt
      POSTGRES_DB: manhunt
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manhunt -d manhunt"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - manhunt-pg:/var/lib/postgresql/data

  server:
    build: ./server
    environment:
      MANHUNT_ENV: home
      MANHUNT_DEV_AUTH: "true"
      MANHUNT_DATABASE_URL: postgresql+psycopg://manhunt:manhunt@db:5432/manhunt
      MANHUNT_SESSION_SIGNING_KEY: ${MANHUNT_SESSION_SIGNING_KEY:-dev-session-signing-key-change-me}
      MANHUNT_QR_SIGNING_KEY: ${MANHUNT_QR_SIGNING_KEY:-dev-qr-signing-key-change-me}
      MANHUNT_TRAIL_KEY: ${MANHUNT_TRAIL_KEY:-abababababababababababababababababababababababababababababababab}
      MANHUNT_TICK_LOOP: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  server-test:
    build: ./server
    profiles: ["test"]
    working_dir: /app
    command: ["pytest", "-q"]
    environment:
      MANHUNT_ENV: test
      MANHUNT_DEV_AUTH: "true"
      MANHUNT_DATABASE_URL: postgresql+psycopg://manhunt:manhunt@db:5432/manhunt
      MANHUNT_SESSION_SIGNING_KEY: test-session-signing-key-change-me
      MANHUNT_QR_SIGNING_KEY: test-qr-signing-key-change-me
      MANHUNT_TICK_LOOP: "false"
    volumes:
      - ./server/tests:/app/tests
    depends_on:
      db:
        condition: service_healthy

  # Quick tunnel (no Cloudflare account). Logs print https://….trycloudflare.com.
  # Named tunnel: set TUNNEL_TOKEN and change command to
  #   tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
  # Never commit TUNNEL_TOKEN.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://server:8000
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - server

volumes:
  manhunt-pg:
