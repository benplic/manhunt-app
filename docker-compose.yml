services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: manhunt
      POSTGRES_PASSWORD: manhunt
      POSTGRES_DB: manhunt
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manhunt -d manhunt"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - manhunt-pg:/var/lib/postgresql/data

  server:
    build: ./server
    environment:
      MANHUNT_ENV: home
      MANHUNT_DEV_AUTH: "true"
      MANHUNT_DATABASE_URL: postgresql+psycopg://manhunt:manhunt@db:5432/manhunt
      MANHUNT_SESSION_SIGNING_KEY: ${MANHUNT_SESSION_SIGNING_KEY:-dev-session-signing-key-change-me}
      MANHUNT_QR_SIGNING_KEY: ${MANHUNT_QR_SIGNING_KEY:-dev-qr-signing-key-change-me}
      MANHUNT_TRAIL_KEY: ${MANHUNT_TRAIL_KEY:-abababababababababababababababababababababababababababababababab}
      MANHUNT_TICK_LOOP: "true"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      # The image has Python but no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  server-test:
    build: ./server
    profiles: ["test"]
    working_dir: /app
    command: ["pytest", "-q"]
    environment:
      MANHUNT_ENV: test
      MANHUNT_DEV_AUTH: "true"
      MANHUNT_DATABASE_URL: postgresql+psycopg://manhunt:manhunt@db:5432/manhunt
      MANHUNT_SESSION_SIGNING_KEY: test-session-signing-key-change-me
      MANHUNT_QR_SIGNING_KEY: test-qr-signing-key-change-me
      MANHUNT_TICK_LOOP: "false"
    volumes:
      - ./server/tests:/app/tests
    depends_on:
      db:
        condition: service_healthy

  # Quick tunnel (no Cloudflare account). Logs print https://….trycloudflare.com.
  # The hostname is random and changes every time this container starts,
  # including restarts after a crash, so phones must be given the new URL.
  # Use scripts/home-server.sh to start it and print the verified URL.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://server:8000
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

  # Named tunnel: a stable hostname that survives restarts. Create the tunnel in
  # the Cloudflare Zero Trust dashboard with a public hostname pointing at
  # http://server:8000, then put its token in TUNNEL_TOKEN in the untracked .env.
  # Never commit TUNNEL_TOKEN. Do not run this and the quick tunnel together.
  tunnel-named:
    image: cloudflare/cloudflared:latest
    profiles: ["named-tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

volumes:
  manhunt-pg:
