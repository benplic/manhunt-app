name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: manhunt
          POSTGRES_PASSWORD: manhunt
          POSTGRES_DB: manhunt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manhunt -d manhunt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MANHUNT_ENV: test
      MANHUNT_DEV_AUTH: "true"
      MANHUNT_DATABASE_URL: postgresql+psycopg://manhunt:manhunt@localhost:5432/manhunt
      MANHUNT_SESSION_SIGNING_KEY: ci-session-signing-key-change-me
      MANHUNT_QR_SIGNING_KEY: ci-qr-signing-key-change-me
      MANHUNT_TICK_LOOP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and test
        run: |
          python -m pip install -e ".[dev]"
          ruff check .
          pytest -q

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test iOS
        working-directory: ios
        run: |
          xcodebuild test \
            -project Manhunt.xcodeproj \
            -scheme Manhunt \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.4'
