name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: manhunt
          POSTGRES_PASSWORD: manhunt
          POSTGRES_DB: manhunt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manhunt -d manhunt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MANHUNT_ENV: test
      MANHUNT_DEV_AUTH: "true"
      MANHUNT_DATABASE_URL: postgresql+psycopg://manhunt:manhunt@localhost:5432/manhunt
      MANHUNT_SESSION_SIGNING_KEY: ci-session-signing-key-change-me
      MANHUNT_QR_SIGNING_KEY: ci-qr-signing-key-change-me
      MANHUNT_TICK_LOOP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and test
        run: |
          python -m pip install -e ".[dev]"
          ruff check .
          pytest -q

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test iOS
        working-directory: ios
        run: |
          set -euo pipefail
          # macos-15's default Xcode is 16.4. That image preinstalls the iOS 18.5
          # simulator, not 18.4. A destination whose OS is not installed makes
          # xcodebuild exit 70 before any test runs. Prefer 18.5, then any other
          # installed 18.x iPhone 16 Pro, then whatever iPhone 16 Pro is present.
          OS="$(
            python3 - << 'PY'
          import re
          import subprocess
          import sys

          proc = subprocess.run(
              [
                  "xcodebuild",
                  "-project",
                  "Manhunt.xcodeproj",
                  "-scheme",
                  "Manhunt",
                  "-showdestinations",
              ],
              check=False,
              capture_output=True,
              text=True,
          )
          text = proc.stdout + proc.stderr
          # "iPhone 16 Pro" must not also match "iPhone 16 Pro Max".
          found = sorted(set(re.findall(
              r"OS:([0-9]+\.[0-9]+), name:iPhone 16 Pro \}",
              text,
          )))
          if not found:
              print(text, file=sys.stderr)
              sys.exit("No iPhone 16 Pro simulator is installed")
          preferred = [v for v in found if v == "18.5"]
          ios18 = [v for v in found if v.startswith("18.")]
          print((preferred or ios18 or found)[0])
          PY
          )"
          echo "Testing on iPhone 16 Pro, iOS ${OS}"
          xcodebuild test \
            -project Manhunt.xcodeproj \
            -scheme Manhunt \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=${OS}"
